<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Musiclet</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="apple-touch-icon" href="logo.png" />
  <meta name="theme-color" content="#6b2fc9" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="credits-theme.css" />
  <link rel="stylesheet" href="badge-styles.css" />
  <link rel="stylesheet" href="token.css" />
  <link rel="stylesheet" href="stats-theme.css" />
</head>
<body>
  <div id="landing" class="screen active">
    <div class="landing-inner">
      <img class="site-logo site-logo-lg" src="logo.png" alt="Musiclet" width="96" height="96" />
      <div class="brand-video-wrap">
        <video class="brand-video" src="musiclet-logo.mp4" autoplay muted loop playsinline></video>
      </div>
      <p class="tagline">Blooket-inspired music quiz platform<br/>Coded &amp; owned by Ethan32</p>
      <div class="btn-row">
        <button class="btn btn-green" onclick="openLogin()">LOGIN!</button>
        <button class="btn btn-purple" onclick="openRegister()">REGISTER</button>
      </div>
    </div>
  </div>

  <div id="app" class="screen">
    <header class="topbar">
      <div class="topbar-left">
        <img class="site-logo site-logo-sm" src="logo.png" alt="Musiclet" width="40" height="40" />
        <span class="brand brand-with-logo"><video class="brand-video-mini" src="musiclet-logo.mp4" autoplay muted loop playsinline></video></span>
      </div>
      <div class="topbar-right">
        <div class="token-pill" id="tokenPill">0</div>
        <button type="button" class="pfp-btn" id="pfpBtn" onclick="openEquipModal()" title="Change avatar">
          <img id="pfpImg" alt="" style="display:none" /><span id="pfpLetter">?</span>
        </button>
        <button type="button" class="user-pill-btn" id="userPill" onclick="showPage('stats')">user</button>
        <button class="btn btn-sm btn-ghost" onclick="logout()">Log out</button>
      </div>
    </header>
    <div class="app-body">
      <nav class="nav sidebar">
        <button class="nav-item active" data-page="stats" onclick="showPage('stats')"><span class="nav-ico">📊</span><span class="nav-label">Stats</span></button>
        <button class="nav-item" data-page="market" onclick="showPage('market')"><span class="nav-ico">🛒</span><span class="nav-label">Market</span></button>
        <button class="nav-item" data-page="blooks" onclick="showPage('blooks')"><span class="nav-ico">🎨</span><span class="nav-label">Blooks</span></button>
        <button class="nav-item" data-page="bazaar" onclick="showPage('bazaar')"><span class="nav-ico">🏪</span><span class="nav-label">Bazaar</span></button>
        <button class="nav-item" data-page="credits" onclick="showPage('credits')"><span class="nav-ico">❤</span><span class="nav-label">Credits</span></button>
        <button class="nav-item" data-page="settings" onclick="showPage('settings')"><span class="nav-ico">⚙</span><span class="nav-label">Settings</span></button>
      </nav>
      <main class="content">
        <section id="page-stats" class="page active"></section>
        <section id="page-market" class="page">
          <div class="page-head"><h1>Market</h1></div>
          <div class="auto-bar" id="autoBar" style="display:none"></div>
          <div class="pack-grid" id="packGrid"></div>
        </section>
        <section id="page-blooks" class="page">
          <div class="page-head"><h1>My Blooks</h1></div>
          <div class="rarity-bar" id="rarityBar"></div>
          <div id="blooksByPack"></div>
        </section>
        <section id="page-bazaar" class="page">
          <div class="page-head"><h1>Bazaar</h1></div>
          <div class="bazaar-controls">
            <input type="search" id="bazaarSearch" class="settings-input" placeholder="Search blooks…" oninput="renderBazaar()" />
            <div class="rarity-bar" id="bazaarPackBar" style="margin-top:12px"></div>
          </div>
          <div class="bazaar-list" id="bazaarList"></div>
        </section>
        <section id="page-credits" class="page">
          <div class="page-head"><h1 style="color:#fff;text-shadow:0 2px 8px rgba(0,0,0,0.3)">Credits</h1><span class="muted" style="color:rgba(255,255,255,0.8)">People behind Musiclet</span></div>
          <div class="credits-grid" id="creditsGrid"></div>
        </section>
        <section id="page-settings" class="page">
          <div class="page-head"><h1>Settings</h1></div>
          <div class="settings-stack" id="settingsStack"></div>
        </section>
      </main>
    </div>
  </div>

  <!-- modals kept minimal; full app modals loaded from existing structure -->
  <div id="modals-root"></div>

  <script src="brand-assets.js"></script>
  <script src="falling-bg.js"></script>
  <script src="catalog.js"></script>
  <script src="app-part1.js"></script>
  <script src="app-part2.js"></script>
  <script src="badges.js"></script>
  <script src="stats-refresh.js"></script>
  <script src="credits.js"></script>
</body>
</html>
