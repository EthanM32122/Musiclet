<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Owner Panel — Musiclet</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="badge-styles.css" />
  <style>
    body { min-height: 100vh; }
    .gate, .owner-panel { max-width: 560px; margin: 40px auto; padding: 0 16px; }
    .owner-panel { display: none; }
    .owner-panel.show { display: block; }
    .gate.hide { display: none; }
    .owner-card { margin-bottom: 16px; }
    .owner-card h3 { margin-bottom: 10px; font-size: 18px; }
    .user-list { font-size: 13px; max-height: 160px; overflow-y: auto; line-height: 1.6; }
    .owner-msg { font-size: 13px; min-height: 18px; margin: 8px 0; font-weight: 600; }
    .owner-msg.ok { color: #2e7d32; }
    .owner-msg.err { color: #c62828; }
    .badge { display: inline-block; background: #0288d1; color: #fff; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 6px; margin-left: 8px; }
  </style>
</head>
<body>
  <div style="min-height:100vh">
    <div class="gate" id="gate">
      <h1>Owner Panel <span class="badge">OWNER</span></h1>
      <p class="muted" style="margin-bottom:20px">Restricted — enter the owner code</p>
      <div class="card">
        <label class="settings-label">Code</label>
        <input type="password" id="codeInput" class="settings-input" autocomplete="off" />
        <p class="owner-msg" id="gateMsg"></p>
        <button type="button" class="btn btn-green full" id="unlockBtn">Unlock</button>
        <p style="margin-top:14px"><a href="/" style="color:#0288d1;font-weight:700;text-decoration:none">← Back</a></p>
      </div>
      <div class="owner-panel" id="panel">
        <div class="card owner-card">
          <h3>Registered users</h3>
          <div class="user-list" id="userList">—</div>
          <button type="button" class="btn btn-sm btn-ghost" style="margin-top:8px" id="refreshBtn">Refresh</button>
        </div>
        <div class="card owner-card">
          <h3>Add / remove tokens</h3>
          <label class="settings-label">Username</label><input type="text" id="tokUser" class="settings-input" />
          <label class="settings-label">Amount (+ add / − remove)</label><input type="number" id="tokAmt" class="settings-input" />
          <p class="owner-msg" id="tokMsg"></p>
          <button type="button" class="btn btn-sm btn-green" id="tokBtn">Apply tokens</button>
        </div>
        <div class="card owner-card">
          <h3>Add / remove Blook</h3>
          <label class="settings-label">Username</label><input type="text" id="blUser" class="settings-input" />
          <label class="settings-label">Blook name</label><input type="text" id="blName" class="settings-input" />
          <label class="settings-label">Qty (+ add / − remove)</label><input type="number" id="blQty" class="settings-input" value="1" />
          <p class="owner-msg" id="blMsg"></p>
          <button type="button" class="btn btn-sm btn-green" id="blBtn">Apply blook</button>
        </div>
        <div class="card owner-card">
          <h3>Assign badges</h3>
          <p class="muted" style="margin-bottom:10px;font-size:13px">Give or remove role badges</p>
          <label class="settings-label">Username</label><input type="text" id="badgeUser" class="settings-input" />
          <label class="settings-label">Badge</label>
          <select id="badgeSelect" class="settings-input">
            <option value="owner">Owner</option>
            <option value="coowner">Co-owner</option>
            <option value="developer">Developer</option>
            <option value="admin">Admin</option>
            <option value="mod">Mod</option>
            <option value="helper">Helper</option>
            <option value="musictuber">Musictuber</option>
            <option value="verified">Verified</option>
            <option value="og">OG</option>
          </select>
          <p class="owner-msg" id="badgeMsg"></p>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
            <button type="button" class="btn btn-sm btn-green" id="addBadgeBtn">Add badge</button>
            <button type="button" class="btn btn-sm btn-danger" id="remBadgeBtn">Remove badge</button>
          </div>
        </div>
        <div class="card owner-card">
          <h3>Custom player PFP</h3>
          <label class="settings-label">Username</label><input type="text" id="pfpUser" class="settings-input" />
          <label class="settings-label">Image</label><input type="file" id="pfpFile" accept="image/*" class="settings-input" />
          <p class="owner-msg" id="pfpMsg"></p>
          <button type="button" class="btn btn-sm btn-green" id="pfpBtn">Set custom PFP</button>
          <button type="button" class="btn btn-sm btn-ghost" id="clearPfpBtn">Clear custom PFP</button>
        </div>
        <div class="card owner-card">
          <h3>Clear Bazaar</h3>
          <p class="muted" style="margin-bottom:10px;font-size:13px">Removes every listing</p>
          <p class="owner-msg" id="bzMsg"></p>
          <button type="button" class="btn btn-sm btn-danger" id="clearBzBtn">Clear all listings</button>
        </div>
        <p style="margin-top:8px"><a href="/" style="color:#0288d1;font-weight:700;text-decoration:none">← Back</a></p>
      </div>
    </div>
  </div>
  <script>
(function () {
  var PANEL_CODE = "hibro122300318";
  var SESSION_KEY = "musiclet_owner_ok";
  var ACC_KEY = "musiclet_accounts";
  var DATA_KEY = "musiclet_data";
  var BAZAAR_KEY = "musiclet_bazaar";
  function loadAcc() { try { return JSON.parse(localStorage.getItem(ACC_KEY) || "{}"); } catch (e) { return {}; } }
  function loadAllData() { try { return JSON.parse(localStorage.getItem(DATA_KEY) || "{}"); } catch (e) { return {}; } }
  function saveAllData(d) { localStorage.setItem(DATA_KEY, JSON.stringify(d)); }
  function defaultData() {
    return { tokens: 1500, exp: 0, packsOpened: 0, inventory: {}, lastClaim: "", equipped: null, customPfp: null, badges: [] };
  }
  function getData(name) {
    var all = loadAllData();
    if (!all[name]) all[name] = defaultData();
    if (!Array.isArray(all[name].badges)) all[name].badges = [];
    return all[name];
  }
  function setData(name, d) {
    var all = loadAllData();
    all[name] = d;
    saveAllData(all);
  }
  function resolveUser(raw) {
    var name = (raw || "").trim();
    if (!name) return null;
    var acc = loadAcc();
    if (acc[name]) return name;
    var lower = name.toLowerCase();
    for (var k in acc) { if (k.toLowerCase() === lower) return k; }
    return null;
  }
  function setMsg(id, text, ok) {
    var el = document.getElementById(id);
    if (!el) return;
    el.textContent = text || "";
    el.className = "owner-msg " + (ok ? "ok" : "err");
  }
  function refreshUsers() {
    var acc = loadAcc();
    var all = loadAllData();
    var names = Object.keys(acc).sort();
    var box = document.getElementById("userList");
    if (!names.length) { box.textContent = "No users yet"; return; }
    box.innerHTML = names.map(function (n) {
      var d = all[n] || defaultData();
      var badges = (d.badges || []).join(", ") || "none";
      return "<div><strong>" + n + "</strong> — " + (d.tokens || 0).toLocaleString() + " 🪙 · badges: " + badges + "</div>";
    }).join("");
  }
  function showPanel() {
    document.getElementById("gate").classList.add("hide");
    document.getElementById("panel").classList.add("show");
    document.getElementById("panel").style.display = "block";
    refreshUsers();
  }
  function tryUnlock() {
    var code = (document.getElementById("codeInput").value || "").trim();
    if (code === PANEL_CODE) {
      try { sessionStorage.setItem(SESSION_KEY, "1"); } catch (e) {}
      setMsg("gateMsg", "Unlocked", true);
      showPanel();
    } else {
      setMsg("gateMsg", "Wrong code", false);
    }
  }
  function adminTokens() {
    var name = resolveUser(document.getElementById("tokUser").value);
    var amt = parseInt(document.getElementById("tokAmt").value, 10);
    if (!name) { setMsg("tokMsg", "User not found", false); return; }
    if (!amt || isNaN(amt)) { setMsg("tokMsg", "Enter an amount", false); return; }
    var d = getData(name);
    d.tokens = Math.max(0, (d.tokens || 0) + amt);
    setData(name, d);
    setMsg("tokMsg", (amt > 0 ? "Added " : "Removed ") + Math.abs(amt) + " tokens for " + name, true);
    refreshUsers();
  }
  function adminBlook() {
    var name = resolveUser(document.getElementById("blUser").value);
    var blook = (document.getElementById("blName").value || "").trim();
    var qty = parseInt(document.getElementById("blQty").value, 10);
    if (!name) { setMsg("blMsg", "User not found", false); return; }
    if (!blook) { setMsg("blMsg", "Enter a blook name", false); return; }
    if (!qty || isNaN(qty)) { setMsg("blMsg", "Enter qty", false); return; }
    var d = getData(name);
    if (!d.inventory) d.inventory = {};
    var cur = d.inventory[blook] || 0;
    var next = Math.max(0, cur + qty);
    if (next === 0) delete d.inventory[blook];
    else d.inventory[blook] = next;
    setData(name, d);
    setMsg("blMsg", "Updated " + blook + " for " + name + " → " + next, true);
    refreshUsers();
  }
  function adminBadge(add) {
    var name = resolveUser(document.getElementById("badgeUser").value);
    var id = (document.getElementById("badgeSelect").value || "").trim();
    if (!name) { setMsg("badgeMsg", "User not found", false); return; }
    if (!id) { setMsg("badgeMsg", "Pick a badge", false); return; }
    var d = getData(name);
    if (!Array.isArray(d.badges)) d.badges = [];
    if (add) {
      if (d.badges.indexOf(id) >= 0) { setMsg("badgeMsg", "Already has that badge", false); return; }
      d.badges.push(id);
      setMsg("badgeMsg", "Added " + id + " to " + name, true);
    } else {
      var i = d.badges.indexOf(id);
      if (i < 0) { setMsg("badgeMsg", "Does not have that badge", false); return; }
      d.badges.splice(i, 1);
      setMsg("badgeMsg", "Removed " + id + " from " + name, true);
    }
    setData(name, d);
    refreshUsers();
  }
  function setCustomPfp() {
    var name = resolveUser(document.getElementById("pfpUser").value);
    var file = document.getElementById("pfpFile").files[0];
    if (!name) { setMsg("pfpMsg", "User not found", false); return; }
    if (!file) { setMsg("pfpMsg", "Pick an image", false); return; }
    var reader = new FileReader();
    reader.onload = function () {
      var d = getData(name);
      d.customPfp = reader.result;
      setData(name, d);
      setMsg("pfpMsg", "Custom PFP set for " + name, true);
    };
    reader.readAsDataURL(file);
  }
  function clearCustomPfp() {
    var name = resolveUser(document.getElementById("pfpUser").value);
    if (!name) { setMsg("pfpMsg", "User not found", false); return; }
    var d = getData(name);
    d.customPfp = null;
    setData(name, d);
    setMsg("pfpMsg", "Cleared custom PFP for " + name, true);
  }
  function clearBazaar() {
    localStorage.setItem(BAZAAR_KEY, "[]");
    setMsg("bzMsg", "Bazaar cleared", true);
  }
  function bind() {
    document.getElementById("unlockBtn").onclick = tryUnlock;
    document.getElementById("codeInput").addEventListener("keydown", function (e) {
      if (e.key === "Enter") tryUnlock();
    });
    document.getElementById("refreshBtn").onclick = refreshUsers;
    document.getElementById("tokBtn").onclick = adminTokens;
    document.getElementById("blBtn").onclick = adminBlook;
    document.getElementById("addBadgeBtn").onclick = function () { adminBadge(true); };
    document.getElementById("remBadgeBtn").onclick = function () { adminBadge(false); };
    document.getElementById("pfpBtn").onclick = setCustomPfp;
    document.getElementById("clearPfpBtn").onclick = clearCustomPfp;
    document.getElementById("clearBzBtn").onclick = clearBazaar;
    try { if (sessionStorage.getItem(SESSION_KEY) === "1") showPanel(); } catch (e) {}
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bind);
  else bind();
})();
  </script>
  <script src="falling-bg.js"></script>
</body>
</html>
