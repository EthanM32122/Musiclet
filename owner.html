<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Musiclet Owner</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="bg-pattern.css" />
  <link rel="stylesheet" href="badge-styles.css" />
  <style>
    body { min-height: 100vh; }
    .owner-wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; position: relative; z-index: 2; }
    .owner-wrap h1 { font-size: 28px; font-weight: 800; margin-bottom: 6px; color: #1a3a5c; }
    .owner-gate, .owner-panel { display: none; }
    .owner-gate.show, .owner-panel.show { display: block; }
    .owner-card { margin-bottom: 16px; }
    .owner-card h3 { margin-bottom: 10px; }
    .owner-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .owner-msg { margin-top: 8px; font-size: 13px; font-weight: 600; min-height: 18px; }
    .owner-msg.ok { color: #2e7d32; }
    .owner-msg.err { color: #c62828; }
    .user-list { max-height: 160px; overflow-y: auto; margin-top: 8px; font-size: 13px; }
    .badge { display: inline-block; background: #0288d1; color: #fff; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 6px; margin-left: 8px; }
  </style>
</head>
<body>
  <div style="min-height:100vh; position:relative; z-index:1">
    <div class="owner-wrap">
      <h1>Owner Panel <span class="badge">OWNER</span></h1>
      <p class="muted" style="margin-bottom:20px">Restricted — enter the owner code</p>
      <div class="card owner-gate show" id="gate">
        <label class="settings-label">Owner code</label>
        <input type="password" id="ownerCode" class="settings-input" placeholder="Enter code" autocomplete="off" />
        <p class="owner-msg" id="gateMsg"></p>
        <button type="button" class="btn btn-green btn-sm" id="unlockBtn">Unlock</button>
        <p style="margin-top:14px"><a href="/" style="color:#0288d1;font-weight:700;text-decoration:none">← Back</a></p>
      </div>
      <div class="owner-panel" id="panel">
        <div class="card owner-card">
          <h3>Registered users</h3>
          <div class="user-list" id="userList">—</div>
          <button type="button" class="btn btn-sm btn-ghost" style="margin-top:8px" id="refreshBtn">Refresh</button>
        </div>
        <div class="card owner-card">
          <h3>Add / remove tokens</h3>
          <label class="settings-label">Username</label><input type="text" id="tokUser" class="settings-input" />
          <label class="settings-label">Amount</label><input type="number" id="tokAmount" class="settings-input" />
          <div class="owner-row">
            <button type="button" class="btn btn-sm btn-green" id="addTokBtn">Add tokens</button>
            <button type="button" class="btn btn-sm btn-danger" id="remTokBtn">Remove tokens</button>
          </div>
          <p class="owner-msg" id="tokMsg"></p>
        </div>
        <div class="card owner-card">
          <h3>Add / remove Blook</h3>
          <label class="settings-label">Username</label><input type="text" id="blUser" class="settings-input" />
          <label class="settings-label">Blook name</label><input type="text" id="blName" class="settings-input" list="blookList" />
          <datalist id="blookList"></datalist>
          <label class="settings-label">Quantity</label><input type="number" id="blQty" class="settings-input" value="1" min="1" />
          <div class="owner-row">
            <button type="button" class="btn btn-sm btn-green" id="addBlBtn">Add blook</button>
            <button type="button" class="btn btn-sm btn-danger" id="remBlBtn">Remove blook</button>
          </div>
          <p class="owner-msg" id="blMsg"></p>
        </div>
        <div class="card owner-card">
          <h3>Assign badges</h3>
          <p class="muted" style="margin-bottom:10px;font-size:13px">Give or remove role badges</p>
          <label class="settings-label">Username</label><input type="text" id="badgeUser" class="settings-input" />
          <label class="settings-label">Badge</label>
          <select id="badgeSelect" class="settings-input">
            <option value="owner">Owner</option>
            <option value="co-owner">Co-owner</option>
            <option value="developer">Developer</option>
            <option value="admin">Admin</option>
            <option value="mod">Mod</option>
            <option value="helper">Helper</option>
            <option value="musictuber">Musictuber</option>
            <option value="verified">Verified</option>
            <option value="og">OG</option>
          </select>
          <div class="owner-row">
            <button type="button" class="btn btn-sm btn-green" id="addBadgeBtn">Add badge</button>
            <button type="button" class="btn btn-sm btn-danger" id="remBadgeBtn">Remove badge</button>
          </div>
          <p class="owner-msg" id="badgeMsg"></p>
        </div>
        <div class="card owner-card">
          <h3>Custom PFP URL</h3>
          <label class="settings-label">Username</label><input type="text" id="pfpUser" class="settings-input" />
          <label class="settings-label">Image URL</label><input type="url" id="pfpUrl" class="settings-input" placeholder="https://..." />
          <div class="owner-row">
            <button type="button" class="btn btn-sm btn-green" id="setPfpBtn">Set custom PFP</button>
            <button type="button" class="btn btn-sm btn-danger" id="clearPfpBtn">Clear PFP</button>
          </div>
          <p class="owner-msg" id="pfpMsg"></p>
        </div>
        <p style="margin-top:14px"><a href="/" style="color:#0288d1;font-weight:700;text-decoration:none">← Back to Musiclet</a></p>
      </div>
    </div>
  </div>
  <script src="bg-apply.js"></script>
  <script>
    const CODE = 'hibro122300318';
    const SESSION_KEY = 'ml_owner_ok';
    function users() { try { return JSON.parse(localStorage.getItem('ml_users') || '{}'); } catch(e) { return {}; } }
    function saveUsers(u) { localStorage.setItem('ml_users', JSON.stringify(u)); }
    function data(u) { try { return JSON.parse(localStorage.getItem('ml_data_' + u) || '{}'); } catch(e) { return {}; } }
    function saveData(u, d) { localStorage.setItem('ml_data_' + u, JSON.stringify(d)); }
    function unlock() {
      const code = document.getElementById('ownerCode').value.trim();
      if (code === CODE) {
        sessionStorage.setItem(SESSION_KEY, '1');
        document.getElementById('gate').classList.remove('show');
        document.getElementById('panel').classList.add('show');
        refreshUsers();
      } else {
        document.getElementById('gateMsg').textContent = 'Wrong code';
        document.getElementById('gateMsg').className = 'owner-msg err';
      }
    }
    function refreshUsers() {
      const u = users();
      const el = document.getElementById('userList');
      const names = Object.keys(u);
      el.textContent = names.length ? names.join(', ') : 'No users';
    }
    document.getElementById('unlockBtn').onclick = unlock;
    document.getElementById('refreshBtn').onclick = refreshUsers;
    if (sessionStorage.getItem(SESSION_KEY) === '1') {
      document.getElementById('gate').classList.remove('show');
      document.getElementById('panel').classList.add('show');
      refreshUsers();
    }
    document.getElementById('addTokBtn').onclick = () => {
      const name = document.getElementById('tokUser').value.trim();
      const amt = parseInt(document.getElementById('tokAmount').value, 10) || 0;
      const u = users();
      if (!u[name]) { document.getElementById('tokMsg').textContent = 'User not found'; document.getElementById('tokMsg').className = 'owner-msg err'; return; }
      const d = data(name); d.tokens = (d.tokens || 0) + amt; saveData(name, d);
      document.getElementById('tokMsg').textContent = 'Added ' + amt + ' tokens'; document.getElementById('tokMsg').className = 'owner-msg ok';
    };
    document.getElementById('remTokBtn').onclick = () => {
      const name = document.getElementById('tokUser').value.trim();
      const amt = parseInt(document.getElementById('tokAmount').value, 10) || 0;
      const u = users();
      if (!u[name]) { document.getElementById('tokMsg').textContent = 'User not found'; document.getElementById('tokMsg').className = 'owner-msg err'; return; }
      const d = data(name); d.tokens = Math.max(0, (d.tokens || 0) - amt); saveData(name, d);
      document.getElementById('tokMsg').textContent = 'Removed ' + amt + ' tokens'; document.getElementById('tokMsg').className = 'owner-msg ok';
    };
    // similar for blook, badge, pfp - keep panel functional
    document.getElementById('addBlBtn').onclick = () => {
      const name = document.getElementById('blUser').value.trim();
      const bl = document.getElementById('blName').value.trim();
      const qty = parseInt(document.getElementById('blQty').value, 10) || 1;
      if (!users()[name]) { document.getElementById('blMsg').textContent = 'User not found'; document.getElementById('blMsg').className = 'owner-msg err'; return; }
      const d = data(name); if (!d.blooks) d.blooks = {}; d.blooks[bl] = (d.blooks[bl] || 0) + qty; saveData(name, d);
      document.getElementById('blMsg').textContent = 'Added ' + qty + 'x ' + bl; document.getElementById('blMsg').className = 'owner-msg ok';
    };
    document.getElementById('remBlBtn').onclick = () => {
      const name = document.getElementById('blUser').value.trim();
      const bl = document.getElementById('blName').value.trim();
      const qty = parseInt(document.getElementById('blQty').value, 10) || 1;
      if (!users()[name]) { document.getElementById('blMsg').textContent = 'User not found'; document.getElementById('blMsg').className = 'owner-msg err'; return; }
      const d = data(name); if (!d.blooks) d.blooks = {}; d.blooks[bl] = Math.max(0, (d.blooks[bl] || 0) - qty); if (d.blooks[bl] === 0) delete d.blooks[bl]; saveData(name, d);
      document.getElementById('blMsg').textContent = 'Removed ' + qty + 'x ' + bl; document.getElementById('blMsg').className = 'owner-msg ok';
    };
    document.getElementById('addBadgeBtn').onclick = () => {
      const name = document.getElementById('badgeUser').value.trim();
      const badge = document.getElementById('badgeSelect').value;
      if (!users()[name]) { document.getElementById('badgeMsg').textContent = 'User not found'; document.getElementById('badgeMsg').className = 'owner-msg err'; return; }
      const d = data(name); if (!d.badges) d.badges = []; if (!d.badges.includes(badge)) d.badges.push(badge); saveData(name, d);
      document.getElementById('badgeMsg').textContent = 'Badge added'; document.getElementById('badgeMsg').className = 'owner-msg ok';
    };
    document.getElementById('remBadgeBtn').onclick = () => {
      const name = document.getElementById('badgeUser').value.trim();
      const badge = document.getElementById('badgeSelect').value;
      if (!users()[name]) { document.getElementById('badgeMsg').textContent = 'User not found'; document.getElementById('badgeMsg').className = 'owner-msg err'; return; }
      const d = data(name); if (!d.badges) d.badges = []; d.badges = d.badges.filter(b => b !== badge); saveData(name, d);
      document.getElementById('badgeMsg').textContent = 'Badge removed'; document.getElementById('badgeMsg').className = 'owner-msg ok';
    };
    document.getElementById('setPfpBtn').onclick = () => {
      const name = document.getElementById('pfpUser').value.trim();
      const url = document.getElementById('pfpUrl').value.trim();
      if (!users()[name]) { document.getElementById('pfpMsg').textContent = 'User not found'; document.getElementById('pfpMsg').className = 'owner-msg err'; return; }
      const d = data(name); d.customPfp = url; saveData(name, d);
      document.getElementById('pfpMsg').textContent = 'PFP set'; document.getElementById('pfpMsg').className = 'owner-msg ok';
    };
    document.getElementById('clearPfpBtn').onclick = () => {
      const name = document.getElementById('pfpUser').value.trim();
      if (!users()[name]) { document.getElementById('pfpMsg').textContent = 'User not found'; document.getElementById('pfpMsg').className = 'owner-msg err'; return; }
      const d = data(name); delete d.customPfp; saveData(name, d);
      document.getElementById('pfpMsg').textContent = 'PFP cleared'; document.getElementById('pfpMsg').className = 'owner-msg ok';
    };
  </script>
</body>
</html>
