<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Musiclet Owner</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="badge-styles.css" />
  <style>
    body { min-height: 100vh; }
    .owner-wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
    .owner-wrap h1 { font-size: 28px; font-weight: 800; margin-bottom: 6px; color: #1a3a5c; }
    .owner-gate, .owner-panel { display: none; }
    .owner-gate.show, .owner-panel.show { display: block; }
    .owner-card { margin-bottom: 16px; }
    .owner-card h3 { margin-bottom: 10px; }
    .owner-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .owner-msg { margin-top: 8px; font-size: 13px; font-weight: 600; min-height: 18px; }
    .owner-msg.ok { color: #2e7d32; }
    .owner-msg.err { color: #c62828; }
    .user-list { max-height: 160px; overflow-y: auto; margin-top: 8px; font-size: 13px; }
    .badge { display: inline-block; background: #0288d1; color: #fff; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 6px; margin-left: 8px; }
  </style>
</head>
<body>
  <div style="min-height:100vh">
    <div class="owner-wrap">
      <h1>Owner Panel <span class="badge">OWNER</span></h1>
      <p class="muted" style="margin-bottom:20px">Restricted — enter the owner code</p>
      <div class="card owner-gate show" id="gate">
        <label class="settings-label">Owner code</label>
        <input type="password" id="ownerCode" class="settings-input" placeholder="Enter code" autocomplete="off" />
        <p class="owner-msg" id="gateMsg"></p>
        <button type="button" class="btn btn-green btn-sm" id="unlockBtn">Unlock</button>
        <p style="margin-top:14px"><a href="/" style="color:#0288d1;font-weight:700;text-decoration:none">← Back</a></p>
      </div>
      <div class="owner-panel" id="panel">
        <div class="card owner-card">
          <h3>Registered users</h3>
          <div class="user-list" id="userList">—</div>
          <button type="button" class="btn btn-sm btn-ghost" style="margin-top:8px" id="refreshBtn">Refresh</button>
        </div>
        <div class="card owner-card">
          <h3>Add / remove tokens</h3>
          <label class="settings-label">Username</label><input type="text" id="tokUser" class="settings-input" />
          <label class="settings-label">Amount</label><input type="number" id="tokAmount" class="settings-input" />
          <div class="owner-row">
            <button type="button" class="btn btn-sm btn-green" id="addTokBtn">Add tokens</button>
            <button type="button" class="btn btn-sm btn-danger" id="remTokBtn">Remove tokens</button>
          </div>
          <p class="owner-msg" id="tokMsg"></p>
        </div>
        <div class="card owner-card">
          <h3>Add / remove Blook</h3>
          <label class="settings-label">Username</label><input type="text" id="blUser" class="settings-input" />
          <label class="settings-label">Blook name</label><input type="text" id="blName" class="settings-input" list="blookList" />
          <datalist id="blookList"></datalist>
          <label class="settings-label">Quantity</label><input type="number" id="blQty" class="settings-input" value="1" min="1" />
          <div class="owner-row">
            <button type="button" class="btn btn-sm btn-green" id="addBlBtn">Add blook</button>
            <button type="button" class="btn btn-sm btn-danger" id="remBlBtn">Remove blook</button>
          </div>
          <p class="owner-msg" id="blMsg"></p>
        </div>
        <div class="card owner-card">
          <h3>Assign badges</h3>
          <p class="muted" style="margin-bottom:10px;font-size:13px">Give or remove role badges</p>
          <label class="settings-label">Username</label><input type="text" id="badgeUser" class="settings-input" />
          <label class="settings-label">Badge</label>
          <select id="badgeSelect" class="settings-input">
            <option value="owner">Owner</option>
            <option value="co-owner">Co-owner</option>
            <option value="developer">Developer</option>
            <option value="admin">Admin</option>
            <option value="mod">Mod</option>
            <option value="helper">Helper</option>
            <option value="musictuber">Musictuber</option>
            <option value="verified">Verified</option>
            <option value="og">OG</option>
          </select>
          <div class="owner-row">
            <button type="button" class="btn btn-sm btn-green" id="addBadgeBtn">Add badge</button>
            <button type="button" class="btn btn-sm btn-danger" id="remBadgeBtn">Remove badge</button>
          </div>
          <p class="owner-msg" id="badgeMsg"></p>
        </div>
        <div class="card owner-card">
          <h3>Custom player PFP</h3>
          <label class="settings-label">Username</label><input type="text" id="pfpUser" class="settings-input" />
          <label class="settings-label">Image</label><input type="file" id="pfpFile" class="settings-input" accept="image/*" />
          <div class="owner-row">
            <button type="button" class="btn btn-sm btn-green" id="setPfpBtn">Set custom PFP</button>
            <button type="button" class="btn btn-sm btn-danger" id="clearPfpBtn">Clear custom PFP</button>
          </div>
          <p class="owner-msg" id="pfpMsg"></p>
        </div>
        <div class="card owner-card settings-danger">
          <h3>Clear Bazaar</h3>
          <button type="button" class="btn btn-sm btn-danger" id="clearBzBtn">Clear entire Bazaar</button>
          <p class="owner-msg" id="bzMsg"></p>
        </div>
        <p style="margin-top:8px"><a href="/" style="color:#0288d1;font-weight:700;text-decoration:none">← Back</a></p>
      </div>
    </div>
  </div>
  <script src="catalog.js"></script>
  <script>
(function () {
  var PANEL_CODE = "hibro122300318";
  var SESSION_KEY = "ml_owner";
  function safeGet(k, f) { try { return localStorage.getItem(k) || f; } catch (e) { return f; } }
  function safeSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function getUsers() { try { return JSON.parse(safeGet("ml_users", "{}")); } catch (e) { return {}; } }
  function defaultData() {
    return { tokens: 1500, exp: 0, packsOpened: 0, inventory: {}, lastClaim: "", equipped: null, customPfp: null, badges: [] };
  }
  function getData(u) {
    try { return Object.assign(defaultData(), JSON.parse(safeGet("ml_data_" + u, "{}"))); }
    catch (e) { return defaultData(); }
  }
  function saveData(u, d) { safeSet("ml_data_" + u, JSON.stringify(d)); }
  function resolveUser(name) {
    var users = getUsers();
    var u = users[(name || "").trim().toLowerCase()];
    return u ? u.username : null;
  }
  function setMsg(id, text, ok) {
    var el = document.getElementById(id);
    if (!el) return;
    el.textContent = text || "";
    el.className = "owner-msg " + (ok ? "ok" : "err");
  }
  function showPanel() {
    document.getElementById("gate").classList.remove("show");
    document.getElementById("panel").classList.add("show");
    refreshUsers();
    fillBlookList();
  }
  function tryUnlock() {
    var code = (document.getElementById("ownerCode").value || "").trim();
    if (code !== PANEL_CODE) { setMsg("gateMsg", "Wrong code", false); return; }
    try { sessionStorage.setItem(SESSION_KEY, "1"); } catch (e) {}
    showPanel();
  }
  function fillBlookList() {
    var dl = document.getElementById("blookList");
    if (!dl || typeof CATALOG === "undefined") return;
    dl.innerHTML = CATALOG.blooks.map(function (b) {
      return "<option value=\"" + b.name.replace(/\"/g, "") + "\"></option>";
    }).join("");
  }
  function refreshUsers() {
    var el = document.getElementById("userList");
    var users = getUsers();
    var names = Object.keys(users).map(function (k) { return users[k].username; }).sort();
    if (!names.length) { el.textContent = "No users yet"; return; }
    el.innerHTML = names.map(function (n) {
      var d = getData(n);
      var badges = (d.badges || []).join(", ") || "none";
      return "<div><strong>" + n + "</strong> — " + d.tokens.toLocaleString() + " 🪙 · badges: " + badges + "</div>";
    }).join("");
  }
  function adminTokens(sign) {
    var name = resolveUser(document.getElementById("tokUser").value);
    var amount = Math.floor(Number(document.getElementById("tokAmount").value) || 0);
    if (!name) { setMsg("tokMsg", "User not found", false); return; }
    if (amount < 1) { setMsg("tokMsg", "Amount must be ≥ 1", false); return; }
    var d = getData(name);
    d.tokens = sign > 0 ? d.tokens + amount : Math.max(0, d.tokens - amount);
    saveData(name, d);
    setMsg("tokMsg", "Updated tokens for " + name, true);
    refreshUsers();
  }
  function adminBlook(sign) {
    var name = resolveUser(document.getElementById("blUser").value);
    var blook = (document.getElementById("blName").value || "").trim();
    var qty = Math.max(1, Math.floor(Number(document.getElementById("blQty").value) || 1));
    if (!name) { setMsg("blMsg", "User not found", false); return; }
    if (!blook) { setMsg("blMsg", "Enter blook name", false); return; }
    var d = getData(name);
    if (sign > 0) {
      d.inventory[blook] = (d.inventory[blook] || 0) + qty;
    } else {
      d.inventory[blook] = Math.max(0, (d.inventory[blook] || 0) - qty);
      if (d.inventory[blook] <= 0) delete d.inventory[blook];
    }
    saveData(name, d);
    setMsg("blMsg", "Updated blooks for " + name, true);
    refreshUsers();
  }
  function adminBadge(add) {
    var name = resolveUser(document.getElementById("badgeUser").value);
    var id = (document.getElementById("badgeSelect").value || "").trim();
    if (!name) { setMsg("badgeMsg", "User not found", false); return; }
    if (!id) { setMsg("badgeMsg", "Pick a badge", false); return; }
    var d = getData(name);
    if (!Array.isArray(d.badges)) d.badges = [];
    if (add) {
      if (d.badges.indexOf(id) >= 0) { setMsg("badgeMsg", "Already has that badge", false); return; }
      d.badges.push(id);
      setMsg("badgeMsg", "Added " + id + " to " + name, true);
    } else {
      var i = d.badges.indexOf(id);
      if (i < 0) { setMsg("badgeMsg", "Does not have that badge", false); return; }
      d.badges.splice(i, 1);
      setMsg("badgeMsg", "Removed " + id + " from " + name, true);
    }
    saveData(name, d);
    refreshUsers();
  }
  function clearBazaar() {
    if (!confirm("Clear ALL bazaar listings?")) return;
    safeSet("ml_bazaar", "[]");
    setMsg("bzMsg", "Bazaar cleared", true);
  }
  function fileToDataUrl(file, maxSize, cb) {
    if (!file || !file.type || file.type.indexOf("image/") !== 0) { cb(null, "Choose an image"); return; }
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var max = maxSize || 256;
        var scale = Math.min(1, max / Math.max(img.width, img.height));
        var c = document.createElement("canvas");
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        cb(c.toDataURL("image/jpeg", 0.85), null);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }
  function setCustomPfp() {
    var name = resolveUser(document.getElementById("pfpUser").value);
    var fileInput = document.getElementById("pfpFile");
    if (!name) { setMsg("pfpMsg", "User not found", false); return; }
    var file = fileInput && fileInput.files && fileInput.files[0];
    if (!file) { setMsg("pfpMsg", "Choose an image", false); return; }
    fileToDataUrl(file, 256, function (data, err) {
      if (err || !data) { setMsg("pfpMsg", err || "Failed", false); return; }
      var d = getData(name);
      d.customPfp = data;
      saveData(name, d);
      setMsg("pfpMsg", "Custom PFP set for " + name, true);
      refreshUsers();
    });
  }
  function clearCustomPfp() {
    var name = resolveUser(document.getElementById("pfpUser").value);
    if (!name) { setMsg("pfpMsg", "User not found", false); return; }
    var d = getData(name);
    d.customPfp = null;
    saveData(name, d);
    setMsg("pfpMsg", "Cleared PFP for " + name, true);
    refreshUsers();
  }
  function bind() {
    document.getElementById("unlockBtn").onclick = tryUnlock;
    document.getElementById("ownerCode").addEventListener("keydown", function (e) { if (e.key === "Enter") tryUnlock(); });
    document.getElementById("refreshBtn").onclick = refreshUsers;
    document.getElementById("addTokBtn").onclick = function () { adminTokens(1); };
    document.getElementById("remTokBtn").onclick = function () { adminTokens(-1); };
    document.getElementById("addBlBtn").onclick = function () { adminBlook(1); };
    document.getElementById("remBlBtn").onclick = function () { adminBlook(-1); };
    document.getElementById("addBadgeBtn").onclick = function () { adminBadge(true); };
    document.getElementById("remBadgeBtn").onclick = function () { adminBadge(false); };
    document.getElementById("setPfpBtn").onclick = setCustomPfp;
    document.getElementById("clearPfpBtn").onclick = clearCustomPfp;
    document.getElementById("clearBzBtn").onclick = clearBazaar;
    try { if (sessionStorage.getItem(SESSION_KEY) === "1") showPanel(); } catch (e) {}
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bind);
  else bind();
})();
  </script>
</body>
</html>
