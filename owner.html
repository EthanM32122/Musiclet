<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Musiclet Owner</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .owner-wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
    .owner-wrap h1 { font-size: 28px; font-weight: 800; margin-bottom: 6px; color: #1a3a5c; }
    .owner-gate, .owner-panel { display: none; }
    .owner-gate.open, .owner-panel.open { display: block; }
    .owner-card { margin-bottom: 16px; }
    .owner-card h3 { margin-bottom: 10px; }
    .owner-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .owner-row .settings-input { flex: 1; min-width: 120px; }
    .owner-msg { margin-top: 8px; font-size: 13px; font-weight: 600; min-height: 18px; }
    .owner-msg.ok { color: #2e7d32; }
    .owner-msg.err { color: #c62828; }
    .user-list { max-height: 160px; overflow-y: auto; margin-top: 8px; font-size: 13px; }
    .user-list div { padding: 4px 0; border-bottom: 1px solid rgba(0,80,140,0.08); }
  </style>
</head>
<body>
  <div id="app" class="screen active" style="min-height:100vh">
    <div class="owner-wrap">
      <h1>Owner Panel</h1>
      <p class="muted" style="margin-bottom:20px">Restricted — enter the owner code</p>

      <div class="card owner-gate open" id="gate">
        <label class="settings-label">Owner code</label>
        <input type="password" id="ownerCode" class="settings-input" placeholder="Code" autocomplete="off" />
        <p class="owner-msg" id="gateMsg"></p>
        <button class="btn btn-green btn-sm" onclick="tryUnlock()">Unlock</button>
        <p style="margin-top:14px"><a href="/" class="profile-link">← Back to Musiclet</a></p>
      </div>

      <div class="owner-panel" id="panel">
        <div class="card owner-card">
          <h3>Registered users</h3>
          <div class="user-list" id="userList">—</div>
          <button class="btn btn-sm btn-ghost" style="margin-top:8px" onclick="refreshUsers()">Refresh</button>
        </div>

        <div class="card owner-card">
          <h3>Add / remove tokens</h3>
          <label class="settings-label">Username</label>
          <input type="text" id="tokUser" class="settings-input" placeholder="Username" />
          <label class="settings-label">Amount</label>
          <input type="number" id="tokAmount" class="settings-input" placeholder="e.g. 5000" />
          <div class="owner-row">
            <button class="btn btn-sm btn-green" onclick="adminTokens(1)">Add tokens</button>
            <button class="btn btn-sm btn-danger" onclick="adminTokens(-1)">Remove tokens</button>
          </div>
          <p class="owner-msg" id="tokMsg"></p>
        </div>

        <div class="card owner-card">
          <h3>Add / remove Blook</h3>
          <label class="settings-label">Username</label>
          <input type="text" id="blUser" class="settings-input" placeholder="Username" />
          <label class="settings-label">Blook name</label>
          <input type="text" id="blName" class="settings-input" list="blookList" placeholder="Exact blook name" />
          <datalist id="blookList"></datalist>
          <label class="settings-label">Quantity</label>
          <input type="number" id="blQty" class="settings-input" value="1" min="1" />
          <div class="owner-row">
            <button class="btn btn-sm btn-green" onclick="adminBlook(1)">Add blook</button>
            <button class="btn btn-sm btn-danger" onclick="adminBlook(-1)">Remove blook</button>
          </div>
          <p class="owner-msg" id="blMsg"></p>
        </div>

        <div class="card owner-card settings-danger">
          <h3>Clear Bazaar</h3>
          <p class="muted settings-desc">Removes every listing. Blooks are not returned to sellers.</p>
          <button class="btn btn-sm btn-danger" onclick="clearBazaar()">Clear entire Bazaar</button>
          <p class="owner-msg" id="bzMsg"></p>
        </div>

        <p style="margin-top:8px"><a href="/" class="profile-link">← Back to Musiclet</a></p>
      </div>
    </div>
  </div>

  <script src="catalog.js"></script>
  <script>
    const OWNER_CODE = "hibro122300318";

    function safeGet(k, f) {
      try { return localStorage.getItem(k) || f; } catch (e) { return f; }
    }
    function safeSet(k, v) {
      try { localStorage.setItem(k, v); return true; } catch (e) { return false; }
    }
    function getUsers() {
      try { return JSON.parse(safeGet("ml_users", "{}")); } catch (e) { return {}; }
    }
    function defaultData() {
      return {
        tokens: (CATALOG && CATALOG.startTokens) || 1500,
        exp: 0,
        packsOpened: 0,
        inventory: {},
        lastClaim: ""
      };
    }
    function getData(u) {
      try {
        return Object.assign(defaultData(), JSON.parse(safeGet("ml_data_" + u, "{}")));
      } catch (e) {
        return defaultData();
      }
    }
    function saveData(u, d) {
      safeSet("ml_data_" + u, JSON.stringify(d));
    }
    function resolveUser(name) {
      const users = getUsers();
      const u = users[(name || "").trim().toLowerCase()];
      return u ? u.username : null;
    }
    function msg(id, text, ok) {
      const el = document.getElementById(id);
      if (!el) return;
      el.textContent = text;
      el.className = "owner-msg " + (ok ? "ok" : "err");
    }

    function tryUnlock() {
      const code = document.getElementById("ownerCode").value || "";
      if (code !== OWNER_CODE) {
        msg("gateMsg", "Wrong code", false);
        return;
      }
      sessionStorage.setItem("ml_owner", "1");
      showPanel();
    }

    function showPanel() {
      document.getElementById("gate").classList.remove("open");
      document.getElementById("panel").classList.add("open");
      refreshUsers();
      fillBlookList();
    }

    function fillBlookList() {
      const dl = document.getElementById("blookList");
      if (!dl || !CATALOG || !CATALOG.blooks) return;
      dl.innerHTML = CATALOG.blooks.map(b =>
        '<option value="' + b.name.replace(/"/g, """) + '">' + b.rarity + " · " + b.pack + "</option>"
      ).join("");
    }

    function refreshUsers() {
      const users = getUsers();
      const el = document.getElementById("userList");
      const names = Object.values(users).map(u => u.username).sort((a, b) => a.localeCompare(b));
      if (!names.length) {
        el.textContent = "No users yet";
        return;
      }
      el.innerHTML = names.map(n => {
        const d = getData(n);
        return "<div><strong>" + n + "</strong> — " + d.tokens.toLocaleString() + " 🪙 · " +
          Object.keys(d.inventory || {}).filter(k => d.inventory[k] > 0).length + " types</div>";
      }).join("");
    }

    function adminTokens(sign) {
      const name = resolveUser(document.getElementById("tokUser").value);
      const amount = Math.floor(Number(document.getElementById("tokAmount").value) || 0);
      if (!name) { msg("tokMsg", "User not found", false); return; }
      if (amount < 1) { msg("tokMsg", "Amount must be at least 1", false); return; }
      const d = getData(name);
      if (sign > 0) {
        d.tokens += amount;
        saveData(name, d);
        msg("tokMsg", "Added " + amount.toLocaleString() + " 🪙 to " + name + " (now " + d.tokens.toLocaleString() + ")", true);
      } else {
        d.tokens = Math.max(0, d.tokens - amount);
        saveData(name, d);
        msg("tokMsg", "Removed " + amount.toLocaleString() + " 🪙 from " + name + " (now " + d.tokens.toLocaleString() + ")", true);
      }
      refreshUsers();
    }

    function adminBlook(sign) {
      const name = resolveUser(document.getElementById("blUser").value);
      const blook = (document.getElementById("blName").value || "").trim();
      const qty = Math.max(1, Math.floor(Number(document.getElementById("blQty").value) || 1));
      if (!name) { msg("blMsg", "User not found", false); return; }
      if (!blook) { msg("blMsg", "Enter a blook name", false); return; }
      const exists = CATALOG.blooks && CATALOG.blooks.some(b => b.name === blook);
      if (!exists) { msg("blMsg", "Unknown blook name (check spelling)", false); return; }
      const d = getData(name);
      if (sign > 0) {
        d.inventory[blook] = (d.inventory[blook] || 0) + qty;
        saveData(name, d);
        msg("blMsg", "Added " + qty + "× " + blook + " to " + name, true);
      } else {
        const have = d.inventory[blook] || 0;
        if (have < 1) { msg("blMsg", name + " doesn't own that blook", false); return; }
        d.inventory[blook] = Math.max(0, have - qty);
        if (d.inventory[blook] <= 0) delete d.inventory[blook];
        saveData(name, d);
        msg("blMsg", "Removed " + Math.min(qty, have) + "× " + blook + " from " + name, true);
      }
      refreshUsers();
    }

    function clearBazaar() {
      if (!confirm("Clear ALL bazaar listings? This cannot be undone.")) return;
      safeSet("ml_bazaar", "[]");
      msg("bzMsg", "Bazaar cleared", true);
    }

    document.addEventListener("DOMContentLoaded", () => {
      if (sessionStorage.getItem("ml_owner") === "1") showPanel();
      document.getElementById("ownerCode").addEventListener("keydown", e => {
        if (e.key === "Enter") tryUnlock();
      });
    });
  </script>
</body>
</html>
